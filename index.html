<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 關西冬遊記</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="關西之旅">
    <link rel="apple-touch-icon" href="https://i.meee.com.tw/QzlcnT2.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVG Icons Components ---
        const SvgIcon = ({ children, className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Icons = {
            Plane: ({ className }) => (<SvgIcon className={className}><path d="M2 22h20" /><path d="M13 6l-7-2.9A2 2 0 0 0 3.4 4L2 7l11 11h9a2 2 0 0 0 2-2v-2l-7-4" /></SvgIcon>),
            Train: ({ className }) => (<SvgIcon className={className}><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1" /><path d="m2 8 2.2-3.9a2 2 0 0 1 1.7-1h12.2a2 2 0 0 1 1.7 1L22 8" /><path d="M22 8v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8" /><path d="M12 12v1" /><path d="M6 12v1" /><path d="M18 12v1" /></SvgIcon>),
            MapPin: ({ className }) => (<SvgIcon className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 0-16 0Z" /><circle cx="12" cy="10" r="3" /></SvgIcon>),
            Camera: ({ className }) => (<SvgIcon className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></SvgIcon>),
            Coffee: ({ className }) => (<SvgIcon className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1" /><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" /><line x1="6" x2="6" y1="2" y2="4" /><line x1="10" x2="10" y1="2" y2="4" /><line x1="14" x2="14" y1="2" y2="4" /></SvgIcon>),
            Bed: ({ className }) => (<SvgIcon className={className}><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8" /><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4" /><path d="M12 4v6" /><path d="M2 18h20" /></SvgIcon>),
            ShoppingBag: ({ className }) => (<SvgIcon className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /></SvgIcon>),
            Utensils: ({ className }) => (<SvgIcon className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></SvgIcon>),
            Info: ({ className }) => (<SvgIcon className={className}><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></SvgIcon>),
            Luggage: ({ className }) => (<SvgIcon className={className}><path d="M6 20h0a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h0" /><path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14" /><path d="M10 20h4" /><circle cx="16" cy="20" r="2" /><circle cx="8" cy="20" r="2" /></SvgIcon>),
            ArrowRight: ({ className }) => (<SvgIcon className={className}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></SvgIcon>),
            X: ({ className }) => (<SvgIcon className={className}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></SvgIcon>),
            Map: ({ className }) => (<SvgIcon className={className}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" /><line x1="9" x2="9" y1="3" y2="18" /><line x1="15" x2="15" y1="6" y2="21" /></SvgIcon>),
            Clock: ({ className }) => (<SvgIcon className={className}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></SvgIcon>),
            Ticket: ({ className }) => (<SvgIcon className={className}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" /><path d="M13 5v2" /><path d="M13 17v2" /><path d="M13 11v2" /></SvgIcon>),
            CloudSun: ({ className }) => (<SvgIcon className={className}><path d="M12 2v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="M20 12h2" /><path d="m19.07 4.93-1.41 1.41" /><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128" /><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z" /></SvgIcon>),
            Snow: ({ className }) => (<SvgIcon className={className}><path d="m10 14-2.5 2.5" /><path d="m14 11 2.5-2.5" /><path d="m14 14 2.5 2.5" /><path d="m10 11-2.5-2.5" /><path d="m10 20-3-3" /><path d="m14 20 3-3" /><path d="m10 4-3 3" /><path d="m14 4 3 3" /><line x1="12" x2="12" y1="2" y2="22" /><line x1="2" x2="22" y1="12" y2="12" /><path d="m20 16-4-4 4-4" /><path d="m4 8 4 4-4 4" /></SvgIcon>),
            Rain: ({ className }) => (<SvgIcon className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M16 14v6" /><path d="M8 14v6" /><path d="M12 16v6" /></SvgIcon>),
            Tools: ({ className }) => (<SvgIcon className={className}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></SvgIcon>),
            Calculator: ({ className }) => (<SvgIcon className={className}><rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" x2="16" y1="6" y2="6" /><line x1="16" x2="16" y1="14" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" /></SvgIcon>),
            CheckList: ({ className }) => (<SvgIcon className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="9" x2="15" y1="10" y2="10" /><line x1="9" x2="15" y1="14" y2="14" /><path d="M6.1 10.1 7.2 11.2" /><path d="M6.1 14.1 7.2 15.2" /></SvgIcon>),
            ShieldAlert: ({ className }) => (<SvgIcon className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="M12 8v4" /><path d="M12 16h.01" /></SvgIcon>),
            Phone: ({ className }) => (<SvgIcon className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.05 12.05 0 0 0 .57 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.03 12.03 0 0 0 2.81.57 2 2 0 0 1 1.72 2.16z" /></SvgIcon>),
            Trash: ({ className }) => (<SvgIcon className={className}><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></SvgIcon>),
            Plus: ({ className }) => (<SvgIcon className={className}><path d="M5 12h14" /><path d="M12 5v14" /></SvgIcon>),
            ArrowLeft: ({ className }) => (<SvgIcon className={className}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></SvgIcon>),
            Globe: ({ className }) => (<SvgIcon className={className}><circle cx="12" cy="12" r="10" /><line x1="2" x2="22" y1="12" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></SvgIcon>),
            Receipt: ({ className }) => (<SvgIcon className={className}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" /><path d="M12 18V6" /></SvgIcon>),
            Swap: ({ className }) => (<SvgIcon className={className}><path d="m7 15 5 5 5-5" /><path d="M7 9 12 4 17 9" /></SvgIcon>),
            ExternalLink: ({ className }) => (<SvgIcon className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" x2="21" y1="14" y2="3" /></SvgIcon>)
        };

        // --- Tool Components (Embedded inside Data) ---

        // 1. Currency Converter Component
        const CurrencyConverter = () => {
            const [amount, setAmount] = useState('');
            const [result, setResult] = useState('');
            const [rate, setRate] = useState(null);
            const [mode, setMode] = useState('JPY_TO_TWD'); // 'JPY_TO_TWD' or 'TWD_TO_JPY'
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchRate = async () => {
                    try {
                        const res = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                        const data = await res.json();
                        setRate(data.rates.TWD);
                    } catch (e) {
                        setRate(0.2135); // Fallback
                    } finally {
                        setLoading(false);
                    }
                };
                fetchRate();
            }, []);

            useEffect(() => {
                if (!rate || !amount) {
                    setResult('');
                    return;
                }
                
                if (mode === 'JPY_TO_TWD') {
                    setResult((parseFloat(amount) * rate).toFixed(0));
                } else {
                    setResult((parseFloat(amount) / rate).toFixed(0));
                }
            }, [amount, rate, mode]);

            const toggleMode = () => {
                setMode(prev => prev === 'JPY_TO_TWD' ? 'TWD_TO_JPY' : 'JPY_TO_TWD');
                setAmount(''); // Clear input on swap for clarity
            };

            const displayRate = mode === 'JPY_TO_TWD' 
                ? `1 JPY ≈ ${rate ? rate.toFixed(4) : '...'} TWD`
                : `1 TWD ≈ ${rate ? (1/rate).toFixed(4) : '...'} JPY`;

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center text-sm text-gray-500 bg-gray-50 px-3 py-2 rounded-lg">
                        <span>即時匯率</span>
                        <span className="font-mono font-bold text-gray-700">{displayRate}</span>
                    </div>
                    
                    <div className="relative">
                        <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">
                            {mode === 'JPY_TO_TWD' ? '日幣 (JPY)' : '台幣 (TWD)'}
                        </label>
                        <input 
                            type="number" 
                            value={amount} 
                            onChange={(e) => setAmount(e.target.value)} 
                            placeholder="輸入金額" 
                            className="w-full p-4 bg-white rounded-xl border-2 border-blue-100 focus:outline-none focus:border-blue-500 text-2xl font-bold text-gray-800 transition-colors" 
                        />
                        
                        {/* Swap Button */}
                        <div className="absolute left-1/2 -bottom-5 transform -translate-x-1/2 z-10">
                            <button 
                                onClick={toggleMode}
                                className="bg-white border-2 border-gray-100 p-2 rounded-full shadow-sm text-blue-500 hover:bg-blue-50 hover:border-blue-200 transition-all active:scale-95"
                            >
                                <Icons.Swap className="w-5 h-5" />
                            </button>
                        </div>
                    </div>
                    
                    <div className="pt-2">
                        <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">
                            {mode === 'JPY_TO_TWD' ? '台幣 (TWD)' : '日幣 (JPY)'}
                        </label>
                        <div className="w-full p-4 bg-blue-50 rounded-xl border border-blue-100 text-blue-800 text-3xl font-black">
                            {result || '0'}
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Tax Free Calculator Component
        const TaxFreeCalculator = () => {
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('excluded'); // 'excluded' (未稅) or 'included' (含稅)
            
            const THRESHOLD_EXCLUDED = 5000;
            const THRESHOLD_INCLUDED = 5500;
            const TAX_RATE = 0.1;

            const calculate = () => {
                const val = parseFloat(amount);
                if (!val) return { reached: false, diff: 0, refund: 0 };

                let currentExcluded = 0;
                let currentIncluded = 0;

                if (type === 'excluded') {
                    currentExcluded = val;
                    currentIncluded = val * (1 + TAX_RATE);
                } else {
                    currentIncluded = val;
                    currentExcluded = val / (1 + TAX_RATE);
                }

                if (currentExcluded >= THRESHOLD_EXCLUDED) {
                    return {
                        reached: true,
                        diff: 0,
                        refund: Math.floor(currentExcluded * TAX_RATE) // Approximate refund (consumption tax)
                    };
                } else {
                    return {
                        reached: false,
                        diff: type === 'excluded' ? Math.ceil(THRESHOLD_EXCLUDED - currentExcluded) : Math.ceil(THRESHOLD_INCLUDED - currentIncluded),
                        refund: 0
                    };
                }
            };

            const result = calculate();

            return (
                <div className="space-y-6">
                    {/* Toggle */}
                    <div className="flex bg-gray-100 p-1 rounded-xl">
                        <button 
                            className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${type === 'excluded' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-400'}`}
                            onClick={() => setType('excluded')}
                        >
                            未稅金額
                        </button>
                        <button 
                            className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${type === 'included' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-400'}`}
                            onClick={() => setType('included')}
                        >
                            含稅金額
                        </button>
                    </div>

                    {/* Input */}
                    <div>
                        <label className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">
                            商品總額 (JPY)
                        </label>
                        <input 
                            type="number" 
                            value={amount} 
                            onChange={(e) => setAmount(e.target.value)} 
                            placeholder={type === 'excluded' ? "輸入標籤上的未稅價" : "輸入含稅總價"}
                            className="w-full p-4 bg-white rounded-xl border-2 border-indigo-100 focus:outline-none focus:border-indigo-500 text-2xl font-bold text-gray-800" 
                        />
                    </div>

                    {/* Result Card */}
                    <div className={`p-5 rounded-2xl border-2 transition-colors ${
                        !amount ? 'bg-gray-50 border-gray-100' :
                        result.reached ? 'bg-green-50 border-green-200' : 'bg-orange-50 border-orange-200'
                    }`}>
                        {!amount ? (
                            <div className="text-center text-gray-400 text-sm">請輸入金額開始計算</div>
                        ) : result.reached ? (
                            <div className="text-center space-y-1">
                                <div className="text-green-600 font-bold text-lg flex items-center justify-center gap-2">
                                    <span className="bg-green-100 p-1 rounded-full"><Icons.X className="w-4 h-4 rotate-45" /></span>
                                    已達免稅門檻！
                                </div>
                                <div className="text-green-800 text-sm">
                                    預計可退稅約 <span className="text-2xl font-black">¥{result.refund.toLocaleString()}</span>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center space-y-1">
                                <div className="text-orange-600 font-bold text-lg">還差一點點！</div>
                                <div className="text-orange-800 text-sm">
                                    再買 <span className="text-2xl font-black">¥{result.diff.toLocaleString()}</span> 即可免稅
                                </div>
                            </div>
                        )}
                    </div>
                    
                    <div className="text-xs text-gray-400 text-center">
                        * 免稅門檻：未稅 ¥5,000 / 含稅 ¥5,500 <br/>
                        * 實際退稅金額依店家手續費而異
                    </div>
                </div>
            );
        };

        // 3. Checklist Component
        const Checklist = () => {
            const [items, setItems] = useState([
                { id: 1, text: "護照", checked: false, type: 'pre' },
                { id: 2, text: "網卡/Wifi機", checked: false, type: 'pre' },
                { id: 3, text: "充電器/轉接頭", checked: false, type: 'pre' },
                { id: 4, text: "常備藥品", checked: false, type: 'pre' },
                { id: 5, text: "日幣現金", checked: false, type: 'pre' },
                { id: 6, text: "交通票券", checked: false, type: 'daily' },
                { id: 7, text: "房卡/鑰匙", checked: false, type: 'daily' },
            ]);
            const [newItem, setNewItem] = useState('');
            const [activeTab, setActiveTab] = useState('daily');

            useEffect(() => { const saved = localStorage.getItem('tripChecklist'); if (saved) setItems(JSON.parse(saved)); }, []);
            useEffect(() => { localStorage.setItem('tripChecklist', JSON.stringify(items)); }, [items]);

            const addItem = () => {
                if (!newItem.trim()) return;
                const newId = Date.now();
                setItems([...items, { id: newId, text: newItem, checked: false, type: activeTab }]);
                setNewItem('');
            };

            const filteredItems = items.filter(i => i.type === activeTab);

            return (
                <div>
                    <div className="flex border-b border-gray-100 mb-3">
                        <button className={`flex-1 py-2 text-sm font-bold ${activeTab === 'pre' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`} onClick={() => setActiveTab('pre')}>行前準備</button>
                        <button className={`flex-1 py-2 text-sm font-bold ${activeTab === 'daily' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`} onClick={() => setActiveTab('daily')}>每日檢查</button>
                    </div>
                    <div className="space-y-2 max-h-[300px] overflow-y-auto mb-3">
                        {filteredItems.map(item => (
                            <div key={item.id} className="flex items-center gap-3">
                                <button onClick={() => setItems(items.map(i => i.id === item.id ? { ...i, checked: !i.checked } : i))} className={`w-6 h-6 rounded border flex items-center justify-center ${item.checked ? 'bg-blue-500 border-blue-500' : 'border-gray-300'}`}>
                                    {item.checked && <Icons.X className="w-4 h-4 text-white rotate-45" />}
                                </button>
                                <span className={`flex-1 text-gray-700 ${item.checked ? 'line-through text-gray-400' : ''}`}>{item.text}</span>
                                <button onClick={() => setItems(items.filter(i => i.id !== item.id))}><Icons.Trash className="w-4 h-4 text-gray-300" /></button>
                            </div>
                        ))}
                    </div>
                    <div className="flex gap-2">
                        <input type="text" value={newItem} onChange={(e) => setNewItem(e.target.value)} placeholder="新增項目..." className="flex-1 p-2 rounded-lg border border-gray-200 text-sm" />
                        <button onClick={addItem} className="bg-blue-500 text-white p-2 rounded-lg"><Icons.Plus className="w-5 h-5" /></button>
                    </div>
                </div>
            );
        };

        // 4. Emergency Card Component
        const EmergencyCard = () => (
            <div className="space-y-4">
                <div className="bg-red-50 p-4 rounded-xl border border-red-100">
                    <h4 className="font-bold text-gray-800">台北駐大阪經濟文化辦事處</h4>
                    <div className="flex gap-2 mt-3">
                        <button 
                            onClick={() => alert('緊急聯絡電話：+81-6-6227-8623')} 
                            className="flex-1 bg-red-600 text-white py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1 active:scale-95 transition-transform"
                        >
                            <Icons.Phone className="w-4 h-4" /> 電話
                        </button>
                        <a 
                            href="https://www.google.com/maps/search/?api=1&query=Taipei+Economic+and+Cultural+Office+in+Osaka+Nakanoshima+Festival+Tower" 
                            target="_blank" 
                            className="flex-1 bg-white text-gray-700 border border-gray-200 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-1 active:scale-95 transition-transform"
                        >
                            <Icons.MapPin className="w-4 h-4" /> 導航
                        </a>
                    </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                    <div className="bg-gray-50 p-3 rounded-lg text-center"><span className="block text-xs text-gray-400 font-bold">報警</span><span className="text-xl font-black text-red-600">110</span></div>
                    <div className="bg-gray-50 p-3 rounded-lg text-center"><span className="block text-xs text-gray-400 font-bold">救護車</span><span className="text-xl font-black text-red-600">119</span></div>
                </div>
            </div>
        );

        // 5. Locker Map Component
        const LockerMap = () => {
            const stations = [
                { name: "難波站", url: "https://coinlocker.click/namba-station.php" },

                                return (
                                    <div key={index} className="relative pl-10 mb-8 last:mb-0 group" onClick={() => setSelectedEvent(event)}>
                                        <div className={`absolute left-[11px] top-4 w-2 h-2 rounded-full border-2 border-white ring-2 ${
                                            index === 0 ? 'bg-green-500 ring-green-100' : 'bg-blue-500 ring-blue-100'
                                        }`}></div>
                                        <span className="absolute -left-1 top-[-20px] text-xs font-mono font-bold text-gray-400">
                                            {event.time}
                                        </span>
                                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 active:scale-[0.98] transition-transform duration-100 cursor-pointer">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-start gap-3">
                                                    <div className={`mt-1 p-2 rounded-xl shrink-0 ${
                                                        event.time === 'Money' || event.time === 'List' || event.time === 'SOS' || event.time === 'Tax' || event.time === 'Locker' ? 'bg-gray-100 text-gray-600' :
                                                        event.type === 'transport' ? 'bg-blue-100 text-blue-600' : 
                                                        event.type === 'alert' ? 'bg-red-50' : 'bg-gray-50'
                                                    }`}>
                                                        <Icon className="w-5 h-5" />
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-gray-800 leading-tight mb-1">{event.title}</h3>
                                                        <p className="text-sm text-gray-500 mb-2">{event.desc}</p>
                                                        {event.title.includes("天王寺站寄物") && (
                                                            <span className="inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded border border-yellow-200">
                                                                重要策略
                                                            </span>
                                                        )}
                                                        {event.title.includes("臨空城") && event.type === 'transport' && (
                                                            <span className="inline-block bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded border border-red-200">
                                                                前4節車廂
                                                            </span>
                                                        )}
                                                        {event.title.includes("WASSIA") && (
                                                            <span className="inline-block bg-rose-100 text-rose-700 text-xs px-2 py-0.5 rounded border border-rose-200 font-bold">
                                                                📅 預約晚餐 19:30
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                                <Icons.ArrowRight className="w-4 h-4 text-gray-300" />
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 safe-bottom shadow-lg z-40">
                        <div className="flex justify-around items-center max-w-md mx-auto h-16">
                            {[1, 2, 3, 4, 5].map((day) => (
                                <button
                                    key={day}
                                    onClick={() => { setActiveDay(day); window.scrollTo(0,0); }}
                                    className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${
                                        activeDay === day ? 'text-blue-600' : 'text-gray-400'
                                    }`}
                                >
                                    <span className={`text-sm font-bold ${activeDay === day ? 'bg-blue-100 px-3 py-1 rounded-full' : ''}`}>
                                        D{day}
                                    </span>
                                    <span className="text-[10px] font-medium">
                                        {day === 1 ? '神戶' : day === 2 ? '姬路' : day === 3 ? '京都' : day === 4 ? '大阪' : '返程'}
                                    </span>
                                </button>
                            ))}
                            {/* Tools Tab */}
                            <button
                                onClick={() => { setActiveDay(6); window.scrollTo(0,0); }}
                                className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${
                                    activeDay === 6 ? 'text-blue-600' : 'text-gray-400'
                                }`}
                            >
                                <span className={`p-1.5 rounded-full ${activeDay === 6 ? 'bg-blue-100' : ''}`}>
                                    <Icons.Tools className="w-5 h-5" />
                                </span>
                                <span className="text-[10px] font-medium">工具</span>
                            </button>
                        </div>
                    </nav>

                    {/* Modal */}
                    {selectedEvent && (
                        <Modal event={selectedEvent} onClose={() => setSelectedEvent(null)} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-fade-in { animation: fade-in 0.2s ease-out; }
    </style>
</body>
</html>
