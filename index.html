<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>202601關西</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="關西之旅">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3233/3233497.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG Icons Components (Directly Embedded for Stability) ---
        
        // 【Fix】 Added missing SvgIcon component definition
        const SvgIcon = ({ children, className = "w-5 h-5" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Icons = {
            Plane: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M2 22h20" />
                    <path d="M13 6l-7-2.9A2 2 0 0 0 3.4 4L2 7l11 11h9a2 2 0 0 0 2-2v-2l-7-4" />
                </SvgIcon>
            ),
            Train: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1" />
                    <path d="m2 8 2.2-3.9a2 2 0 0 1 1.7-1h12.2a2 2 0 0 1 1.7 1L22 8" />
                    <path d="M22 8v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8" />
                    <path d="M12 12v1" />
                    <path d="M6 12v1" />
                    <path d="M18 12v1" />
                </SvgIcon>
            ),
            MapPin: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 0-16 0Z" />
                    <circle cx="12" cy="10" r="3" />
                </SvgIcon>
            ),
            Camera: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                    <circle cx="12" cy="13" r="3" />
                </SvgIcon>
            ),
            Coffee: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
                    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
                    <line x1="6" x2="6" y1="2" y2="4" />
                    <line x1="10" x2="10" y1="2" y2="4" />
                    <line x1="14" x2="14" y1="2" y2="4" />
                </SvgIcon>
            ),
            Bed: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8" />
                    <path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4" />
                    <path d="M12 4v6" />
                    <path d="M2 18h20" />
                </SvgIcon>
            ),
            ShoppingBag: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </SvgIcon>
            ),
            Utensils: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                    <path d="M7 2v20" />
                    <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                </SvgIcon>
            ),
            Info: ({ className }) => (
                <SvgIcon className={className}>
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                </SvgIcon>
            ),
            Luggage: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M6 20h0a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h0" />
                    <path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14" />
                    <path d="M10 20h4" />
                    <circle cx="16" cy="20" r="2" />
                    <circle cx="8" cy="20" r="2" />
                </SvgIcon>
            ),
            ArrowRight: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M5 12h14" />
                    <path d="m12 5 7 7-7 7" />
                </SvgIcon>
            ),
            X: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </SvgIcon>
            ),
            Map: ({ className }) => (
                <SvgIcon className={className}>
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
                    <line x1="9" x2="9" y1="3" y2="18" />
                    <line x1="15" x2="15" y1="6" y2="21" />
                </SvgIcon>
            ),
            Clock: ({ className }) => (
                <SvgIcon className={className}>
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </SvgIcon>
            ),
            Ticket: ({ className }) => (
                <SvgIcon className={className}>
                    <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
                    <path d="M13 5v2" />
                    <path d="M13 17v2" />
                    <path d="M13 11v2" />
                </SvgIcon>
            )
        };

        // Data: Itinerary
        const itineraryData = [
            {
                day: 1,
                date: "1/07 (三)",
                title: "神戶夜景與異人館",
                color: "bg-blue-500",
                ticket: "關西廣域周遊券 (Day 1)",
                startTime: "05:00 (高雄機場集合)",
                events: [
                    { time: "07:05", title: "長榮航空 BR182", type: "transport", icon: "Plane", desc: "高雄 KHH 起飛", details: "抵達關西機場 10:55。出關預留 1.5 小時。", location: "Kansai International Airport" },
                    { time: "12:30", title: "JR HARUKA 特急", type: "transport", icon: "Train", desc: "前往新大阪", details: "啟用【關西廣域周遊券】。車程約 50 分鐘。", location: "Kansai Airport Station" },
                    { time: "13:30", title: "東橫INN 新大阪", type: "hotel", icon: "Bed", desc: "寄放行李", details: "位於新大阪中央口本館。Check-in 後輕裝出發。", location: "Toyoko Inn Shin-Osaka Chuo-guchi Honkan" },
                    { time: "14:30", title: "神戶布引香草園", type: "sight", icon: "Camera", desc: "搭乘纜車眺望", details: "位於新神戶站旁，搭乘纜車上山欣賞神戶市景與冬季花園。", location: "Kobe Nunobiki Herb Gardens & Ropeway" },
                    { time: "16:00", title: "北野異人館", type: "sight", icon: "MapPin", desc: "神戶散策", details: "充滿異國風情的街道。建議步行遊覽風見雞館、萌黃之館。", location: "Kobe Kitano Ijinkan-gai" },
                    { time: "17:00", title: "星巴克 異人館店", type: "food", icon: "Coffee", desc: "百年洋房咖啡", details: "神戶北野異人館店，感受復古氛圍。", location: "Starbucks Coffee - Kobe Kitano Ijinkan" },
                    { time: "18:00", title: "神戶港夜景", type: "sight", icon: "Camera", desc: "美利堅公園/Mosaic", details: "海邊風大請注意保暖。可於馬賽克廣場逛逛。", location: "Kobe Harborland Mosaic" },
                    { time: "19:30", title: "神戶牛燒肉 WASSIA", type: "food", icon: "Utensils", desc: "預約晚餐", details: "【已預約 19:30】享受頂級神戶牛燒肉，請準時抵達。", location: "Kobe Beef Yakiniku WASSIA" },
                    { time: "21:30", title: "返回新大阪", type: "transport", icon: "Train", desc: "新幹線回程", details: "從新神戶搭新幹線回新大阪，僅需 13 分鐘。", location: "Shin-Kobe Station" }
                ]
            },
            {
                day: 2,
                date: "1/08 (四)",
                title: "姬路城與倉敷美觀",
                color: "bg-indigo-500",
                ticket: "關西廣域周遊券 (Day 2)",
                startTime: "07:40 (飯店大廳)",
                events: [
                    { time: "08:00", title: "前往姬路", type: "transport", icon: "Train", desc: "山陽新幹線", details: "搭乘新幹線前往姬路站，車程約 30-40 分。", location: "Shin-Osaka Station" },
                    { time: "09:10", title: "姬路城", type: "sight", icon: "Camera", desc: "世界文化遺產", details: "預計停留 2.5 小時。需爬陡峭樓梯，建議輕便服裝。", location: "Himeji Castle" },
                    { time: "13:00", title: "前往倉敷", type: "transport", icon: "Train", desc: "新幹線轉乘", details: "姬路→岡山(新幹線)，轉乘 JR 山陽本線至倉敷。", location: "Kurashiki Station" },
                    { time: "14:00", title: "倉敷美觀地區", type: "sight", icon: "MapPin", desc: "白壁老街散策", details: "店家多於 17:00 關門，請把握時間。建議搭乘遊船。", location: "Kurashiki Bikan Historical Quarter" },
                    { time: "18:00", title: "岡山晚餐", type: "food", icon: "Utensils", desc: "岡山站周邊", details: "倉敷晚上較冷清，建議回岡山車站用餐。", location: "Okayama Station" },
                    { time: "20:00", title: "返回新大阪", type: "transport", icon: "Train", desc: "新幹線回程", details: "岡山→新大阪，利用周遊券。", location: "Shin-Osaka Station" }
                ]
            },
            {
                day: 3,
                date: "1/09 (五)",
                title: "京都貴船雪景",
                color: "bg-red-500",
                ticket: "京阪電車一日券(擴大版)",
                startTime: "08:20 (飯店大廳)",
                events: [
                    { time: "08:30", title: "前往淀屋橋", type: "transport", icon: "Train", desc: "地鐵御堂筋線", details: "需自費搭乘地鐵 (新大阪→淀屋橋) 轉乘京阪電車。", location: "Yodoyabashi Station" },
                    { time: "09:00", title: "前往貴船", type: "transport", icon: "Train", desc: "京阪電車+叡山電鐵", details: "【啟用京阪一日券】。淀屋橋→出町柳→貴船口→巴士。", location: "Kibune Shrine" },
                    { time: "10:50", title: "貴船神社", type: "sight", icon: "Camera", desc: "水占卜與紅燈籠", details: "山區氣溫低，注意保暖與路面濕滑。", location: "Kifune Shrine" },
                    { time: "13:00", title: "下鴨神社", type: "sight", icon: "MapPin", desc: "糾之森", details: "返回出町柳站後步行前往。", location: "Shimogamo Shrine" },
                    { time: "16:00", title: "京都御苑/河原町", type: "shopping", icon: "ShoppingBag", desc: "市區逛街", details: "視腳力決定。晚餐建議在京都車站解決。", location: "Kyoto Station" }
                ]
            },
            {
                day: 4,
                date: "1/10 (六)",
                title: "大阪市區與臨空城",
                color: "bg-orange-500",
                ticket: "關西廣域周遊券 (Day 4)",
                startTime: "09:30 (退房出發)",
                events: [
                    { time: "09:30", title: "退房出發", type: "transport", icon: "Luggage", desc: "帶行李搭 HARUKA", details: "利用周遊券搭乘 HARUKA 至天王寺站 (舒適有行李架)。", location: "Shin-Osaka Station" },
                    { time: "10:20", title: "天王寺站寄物", type: "info", icon: "Luggage", desc: "中央口置物櫃", details: "【關鍵策略】將行李寄放在 JR 天王寺站中央口，不用走回頭路。", location: "Tennoji Station" },
                    { time: "10:40", title: "新世界與通天閣", type: "sight", icon: "Camera", desc: "大阪懷舊風情", details: "步行可達 Tenshiba 公園與動物園。", location: "Tsutenkaku" },
                    { time: "15:00", title: "前往臨空城", type: "transport", icon: "Train", desc: "關空快速 (JR)", details: "【重要】務必搭乘「前 4 節車廂」！後 4 節會去和歌山。", location: "Rinku Town Station" },
                    { time: "16:00", title: "OMO 關西機場", type: "hotel", icon: "Bed", desc: "Check-in", details: "星野集團飯店，位於臨空城站旁。", location: "OMO Kansai Airport by Hoshino Resorts" },
                    { time: "16:30", title: "臨空城 Outlet", type: "shopping", icon: "ShoppingBag", desc: "購物晚餐", details: "折扣季大買特買，營業至 20:00。", location: "Rinku Premium Outlets" }
                ]
            },
            {
                day: 5,
                date: "1/11 (日)",
                title: "返程",
                color: "bg-green-500",
                ticket: "關西廣域周遊券 (Day 5)",
                startTime: "09:30 (退房出發)",
                events: [
                    { time: "09:30", title: "前往機場", type: "transport", icon: "Plane", desc: "電車接駁", details: "搭乘南海電鐵或 JR 一站即達關西機場。", location: "Kansai International Airport" },
                    { time: "09:50", title: "抵達機場", type: "info", icon: "Info", desc: "辦理登機", details: "建議起飛前 2-2.5 小時抵達。長榮航空櫃台。", location: "Kansai Airport Terminal 1" },
                    { time: "11:55", title: "長榮航空 BR181", type: "transport", icon: "Plane", desc: "返回高雄", details: "14:30 抵達高雄小港機場。", location: "Kansai International Airport" }
                ]
            }
        ];

        // Component: Event Modal
        const Modal = ({ event, onClose }) => {
            if (!event) return null;
            
            // Render specific icon
            const Icon = Icons[event.icon];
            const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`;

            return (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 transform transition-all animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-start mb-4">
                            <div className="flex items-center gap-3">
                                <div className={`p-3 rounded-full ${
                                    event.type === 'transport' ? 'bg-blue-100 text-blue-600' :
                                    event.type === 'hotel' ? 'bg-indigo-100 text-indigo-600' :
                                    'bg-orange-100 text-orange-600'
                                }`}>
                                    <Icon className="w-6 h-6" />
                                </div>
                                <div>
                                    <h3 className="text-xl font-bold text-gray-800">{event.title}</h3>
                                    <p className="text-sm text-gray-500">{event.time} · {event.type === 'transport' ? '交通' : event.type === 'sight' ? '景點' : '活動'}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200">
                                <Icons.X className="w-5 h-5" />
                            </button>
                        </div>
                        
                        <div className="space-y-4">
                            <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                                <p className="text-gray-700 leading-relaxed">{event.details}</p>
                            </div>

                            <a href={googleMapUrl} target="_blank" rel="noopener noreferrer" 
                               className="flex items-center justify-center gap-2 w-full py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition active:scale-95">
                                <Icons.Map className="w-5 h-5" />
                                開啟 Google 地圖
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeDay, setActiveDay] = useState(1);
            const [selectedEvent, setSelectedEvent] = useState(null);
            
            const currentData = itineraryData.find(d => d.day === activeDay);

            return (
                <div className="min-h-screen pb-24 safe-bottom">
                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200 px-6 py-4 shadow-sm">
                        <div className="flex justify-between items-center max-w-md mx-auto">
                            <div>
                                <h1 className="text-lg font-bold text-gray-800">2026 關西之旅</h1>
                                <p className="text-xs text-gray-500 font-medium tracking-wide">
                                    DAY {activeDay} · {currentData.date}
                                </p>
                            </div>
                            <div className={`px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm ${currentData.color}`}>
                                {currentData.title.split(' ')[0]}
                            </div>
                        </div>
                    </header>

                    {/* Timeline Content */}
                    <main className="max-w-md mx-auto px-4 py-6">
                        <div className="relative">
                            {/* Vertical Line */}
                            <div className="absolute left-4 top-2 bottom-0 w-0.5 bg-gray-200"></div>

                            {currentData.events.map((event, index) => {
                                const Icon = Icons[event.icon];
                                return (
                                    <div key={index} className="relative pl-10 mb-8 last:mb-0 group" onClick={() => setSelectedEvent(event)}>
                                        {/* Dot on line */}
                                        <div className={`absolute left-[11px] top-4 w-2 h-2 rounded-full border-2 border-white ring-2 ${
                                            index === 0 ? 'bg-green-500 ring-green-100' : 'bg-blue-500 ring-blue-100'
                                        }`}></div>

                                        {/* Time Label */}
                                        <span className="absolute -left-1 top-[-20px] text-xs font-mono font-bold text-gray-400">
                                            {event.time}
                                        </span>

                                        {/* Card */}
                                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 active:scale-[0.98] transition-transform duration-100 cursor-pointer">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-start gap-3">
                                                    <div className={`mt-1 p-2 rounded-xl shrink-0 ${
                                                        event.type === 'transport' ? 'bg-blue-50' : 
                                                        event.type === 'alert' ? 'bg-red-50' : 'bg-gray-50'
                                                    }`}>
                                                        <Icon className="w-5 h-5" />
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-gray-800 leading-tight mb-1">{event.title}</h3>
                                                        <p className="text-sm text-gray-500 mb-2">{event.desc}</p>
                                                        {event.title.includes("天王寺站寄物") && (
                                                            <span className="inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded border border-yellow-200">
                                                                重要策略
                                                            </span>
                                                        )}
                                                        {event.title.includes("臨空城") && event.type === 'transport' && (
                                                            <span className="inline-block bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded border border-red-200">
                                                                前4節車廂
                                                            </span>
                                                        )}
                                                        {event.title.includes("WASSIA") && (
                                                            <span className="inline-block bg-rose-100 text-rose-700 text-xs px-2 py-0.5 rounded border border-rose-200 font-bold">
                                                                📅 預約晚餐 19:30
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                                <Icons.ArrowRight className="w-4 h-4 text-gray-300" />
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {/* Day Summary / Tips */}
                        <div className="mt-8 bg-gray-100 rounded-xl p-4 text-sm text-gray-600 space-y-3">
                            <h4 className="font-bold text-gray-800 flex items-center gap-2">
                                <Icons.Info className="w-4 h-4 text-blue-500" /> 本日小提醒
                            </h4>
                            
                            {/* New Info Blocks: Departure & Tickets */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                    <div className="flex items-center gap-1.5 text-gray-400 mb-1.5">
                                        <Icons.Clock className="w-3.5 h-3.5" />
                                        <span className="text-[10px] uppercase font-bold tracking-wider">建議出發</span>
                                    </div>
                                    <p className="font-bold text-gray-800 text-sm">{currentData.startTime}</p>
                                </div>
                                <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                    <div className="flex items-center gap-1.5 text-gray-400 mb-1.5">
                                        <Icons.Ticket className="w-3.5 h-3.5" />
                                        <span className="text-[10px] uppercase font-bold tracking-wider">今日票券</span>
                                    </div>
                                    <p className="font-bold text-gray-800 text-sm truncate" title={currentData.ticket}>{currentData.ticket}</p>
                                </div>
                            </div>

                            {/* Existing Text Tip */}
                            <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                <p className="leading-relaxed text-gray-700">
                                   {activeDay === 1 && "神戶港風大，戴保暖的帽子。"}
                                   {activeDay === 2 && "姬路城階梯陡峭，穿好走的鞋。倉敷店家約 17:00 打烊。"}
                                   {activeDay === 3 && "貴船神社若積雪會很美，但要注意路面濕滑。"}
                                   {activeDay === 4 && "記得把行李寄放在天王寺 JR 中央口，搭車去臨空城要坐第 1-4 車廂。"}
                                   {activeDay === 5 && "提早到機場，關西機場人潮眾多。"}
                                </p>
                            </div>
                        </div>
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 safe-bottom shadow-lg z-40">
                        <div className="flex justify-around items-center max-w-md mx-auto h-16">
                            {[1, 2, 3, 4, 5].map((day) => (
                                <button
                                    key={day}
                                    onClick={() => { setActiveDay(day); window.scrollTo(0,0); }}
                                    className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${
                                        activeDay === day ? 'text-blue-600' : 'text-gray-400'
                                    }`}
                                >
                                    <span className={`text-sm font-bold ${activeDay === day ? 'bg-blue-100 px-3 py-1 rounded-full' : ''}`}>
                                        D{day}
                                    </span>
                                    <span className="text-[10px] font-medium">
                                        {day === 1 ? '神戶' : day === 2 ? '姬路' : day === 3 ? '京都' : day === 4 ? '大阪' : '返程'}
                                    </span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Modal */}
                    {selectedEvent && (
                        <Modal event={selectedEvent} onClose={() => setSelectedEvent(null)} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-fade-in { animation: fade-in 0.2s ease-out; }
    </style>
</body>
</html>
