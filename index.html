        opacity: 0.4;
        padding: 13px;

        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        transition: opacity 0.3s;
    }
    
    .staticrypt-toggle-password-visibility:hover {
        opacity: 0.8;
    }

    .staticrypt-form .staticrypt-decrypt-button {
        text-transform: uppercase;
        outline: 0;
        background: var(--primary); /* 使用抹茶綠 */
        width: 100%;
        border: 0;
        padding: 16px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 1px; /* 增加字距，提升質感 */

        border-radius: 50px; /* 按鈕變成膠囊形狀 */
        transition: background 0.3s ease, transform 0.1s ease;
        box-shadow: 0 4px 12px rgba(141, 163, 153, 0.3); /* 按鈕帶一點點色光陰影 */

        background: var(--primary-hover);
        transform: translateY(-1px); /* 懸浮微動 */
    }

    .staticrypt-form .staticrypt-decrypt-button:active {
        transform: translateY(1px);
    }

        height: 100%;

        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 0.5em;
    }

        align-items: center;

        cursor: pointer;

        height: 10px;

    }

    .staticrypt-remember input[type="checkbox"]:checked::before {
        transform: scale(1);
    }
    
    .staticrypt-remember input[type="checkbox"]:checked {
        border-color: var(--primary);
    }

    }

        }
    }
